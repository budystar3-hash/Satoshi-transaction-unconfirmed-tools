<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Unconfirmed Transaction Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
            position: relative;
        }

        /* Language Selector (Top Right - English Prioritized) */
        .lang-selector {
            position: absolute;
            top: 12px;
            right: 16px;
            background: #151b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }

        /* Extra Large Main Bitcoin Logo (Outside Card) */
        .outer-bitcoin-logo {
            width: 155px;
            height: 155px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 22px rgba(247, 147, 26, 0.65));
            animation: pulse-glow 3s infinite alternate;
            transition: all 0.3s ease;
        }

        body.dashboard-mode .outer-bitcoin-logo {
            width: 105px;
            height: 105px;
            margin-bottom: 5px;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 14px rgba(247, 147, 26, 0.45)); }
            100% { filter: drop-shadow(0 0 26px rgba(247, 147, 26, 0.8)); }
        }

        /* Main Brand Title Outside Card */
        .main-brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        body.dashboard-mode .main-brand-title {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .card {
            background: #151b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 16px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75);
        }

        /* Auth Tabs */
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #0d1117;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 14px;
        }

        .auth-tab-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            padding: 7px;
            font-size: 11.5px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-tab-btn.active {
            background: #f7931a;
            color: #0b0e14;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 6px;
        }

        .header-satoshi-logo {
            width: 25px;
            height: 25px;
            filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.4));
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .header-text p {
            font-size: 9.5px;
            color: #8b949e;
        }

        .form-group {
            margin-bottom: 10px;
        }

        body.dashboard-mode .form-group {
            margin-bottom: 7px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 3px;
        }

        .input-with-action {
            display: flex;
            gap: 6px;
            align-items: stretch;
        }

        input[type="text"],
        input[type="password"] {
            flex: 1;
            width: 100%;
            min-width: 0;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 7px 10px;
            color: #ffffff;
            font-size: 11.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        body.dashboard-mode input[type="text"] {
            padding: 5.5px 9px;
            font-size: 11px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #f7931a;
        }

        /* Tamper-proof style for verified confirmation code */
        input.verified-lock {
            border-color: #2ea043 !important;
            background: rgba(46, 160, 67, 0.08) !important;
            color: #3fb950 !important;
            font-weight: 700;
            letter-spacing: 0.5px;

        .toggle-pass-btn {

            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 6px;
            padding: 0 9px;
            font-size: 10px;

        .mempool-btn {

            border-radius: 6px;
            padding: 0 9px;
            display: flex;

            flex-shrink: 0;

        .mempool-btn:hover {

        .mempool-btn svg {

            height: 16px;

        .get-code-inline-btn {

            border: 1px solid #30363d;
            border-radius: 6px;

            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;

    <script>
        let currentAuthMode = 'login';

        // CRYPTOGRAPHIC SECURITY VAULT (Encapsulated in closure to prevent console tampering)
        const SecurityVault = (function() {
            const usedPaymentIds = new Set();
            const consumedCodes = new Set();
            // Active code registry: maps confirmationCode -> { boundTxHash, signature, timestamp }
            const issuedCodes = new Map();
            const sessionSecret = crypto.getRandomValues(new Uint32Array(4)).join('-');

            async function computeHmacSignature(code, txHash) {
                const encoder = new TextEncoder();
                const data = encoder.encode(`${code}::${txHash.toLowerCase()}::${sessionSecret}`);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            return {
                isPaymentUsed: (pid) => usedPaymentIds.has(pid.toUpperCase()),
                registerPayment: (pid) => usedPaymentIds.add(pid.toUpperCase()),
                
                async issueCodeForTx(txHash) {
                    const cleanTx = txHash.trim();
                    const randomBytes = new Uint8Array(6);
                    crypto.getRandomValues(randomBytes);
                    const hexToken = Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
                    const code = `BTC-SEC-${hexToken}`;
                    const sig = await computeHmacSignature(code, cleanTx);

                    issuedCodes.set(code, {
                        boundTxHash: cleanTx,
                        signature: sig,
                        createdAt: Date.now()
                    });
                    return code;
                },

                async validateAndConsumeCode(inputCode, currentTxHash) {
                    const code = inputCode.trim();
                    const cleanTx = currentTxHash.trim();

                    // 1. Check if code was already used (Replay Attack Prevention)
                    if (consumedCodes.has(code)) {
                        return { valid: false, reason: 'REPLAY_ATTACK' };
                    }

                    // 2. Check if code exists in official issued registry (Rejects fabricated/fake codes)
                    const record = issuedCodes.get(code);
                    if (!record) {
                        return { valid: false, reason: 'FAKE_OR_UNISSUED' };
                    }

                    // 3. Check if code belongs to a different transaction (Cross-Tx Reuse Prevention)
                    if (record.boundTxHash !== cleanTx) {
                        return { valid: false, reason: 'WRONG_TRANSACTION' };
                    }

                    // 4. Verify cryptographic signature integrity (Anti-Tampering / Anti-Hack)
                    const expectedSig = await computeHmacSignature(code, cleanTx);
                    if (record.signature !== expectedSig) {
                        return { valid: false, reason: 'TAMPERED_SIGNATURE' };
                    }

                    // Mark code as permanently consumed
                    consumedCodes.add(code);
                    issuedCodes.delete(code);
                    return { valid: true };
                }
            };
        })();

        const translations = {
            en: {
                brandTitle: "Bitcoin Unconfirmed Transaction Tool",
                tabLogin: "Login",
                tabRegister: "Register",
                lblAuthLn: "Lightning Address",
                lblAuthPass: "Password",

        function gantiBahasa(lang) {
            const t = translations[lang] || translations.en;
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (t[key]) el.placeholder = t[key];
            });

            const authBtn = document.getElementById('authSubmitBtn');
            authBtn.textContent = currentAuthMode === 'login' ? t.btnLogin : t.btnRegister;

            const dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('authCard').dir = dir;
            document.getElementById('mainCard').dir = dir;
            document.getElementById('modalCard').dir = dir;
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang] || translations.en;

            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const confirmGroup = document.getElementById('confirmPassGroup');
            const confirmInput = document.getElementById('authConfirmPassword');
            const authBtn = document.getElementById('authSubmitBtn');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                confirmGroup.classList.add('hidden');
                confirmInput.required = false;
                authBtn.textContent = t.btnLogin;
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                confirmGroup.classList.remove('hidden');
                confirmInput.required = true;
                authBtn.textContent = t.btnRegister;
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const lnAddr = document.getElementById('authLnAddress').value.trim();
            const pass = document.getElementById('authPassword').value;

            if (!lnAddr.includes('@')) {
                alert('⚠️ Invalid Lightning Address format! Example: name@speed.app');
                return;
            }

            if (currentAuthMode === 'register') {
                const confirmPass = document.getElementById('authConfirmPassword').value;
                if (pass !== confirmPass) {
                    alert('⚠️ Password and Confirm Password do not match!');
                    return;
                }
            }

            document.getElementById('lnAddress').value = lnAddr;
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            document.body.classList.add('dashboard-mode');
        }

        function keluarDashboard() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('authCard').classList.remove('hidden');
            document.body.classList.remove('dashboard-mode');
        }

        function resetKodeJikaTxBerubah() {
            const codeField = document.getElementById('confirmCode');
            if (codeField.classList.contains('verified-lock')) {
                codeField.value = '';
                codeField.readOnly = false;
                codeField.classList.remove('verified-lock');
            }
        }

        function bukaModalPembayaran() {
            const hashInput = document.getElementById('txHash').value.trim();
            if (!hashInput || hashInput.length < 16) {
                alert('⚠️ Security Alert: Please enter a valid TxHash (minimum 16 characters) before requesting a confirmation code!');
                return;
            }
            document.getElementById('paymentIdInput').value = '';
            document.getElementById('paymentModal').style.display = 'flex';
        }

        function tutupModalPembayaran() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function salinAlamat() {
            navigator.clipboard.writeText('workerbtc@speed.app');
            alert('Lightning address copied: workerbtc@speed.app');
        }

        function bukaSpeedWallet() {
            window.open('lightning:workerbtc@speed.app', '_blank');
        }

        async function verifikasiPaymentIdAndConfirm() {
            const paymentId = document.getElementById('paymentIdInput').value.trim();
            const currentTxHash = document.getElementById('txHash').value.trim();

            if (!currentTxHash) {
                alert('⚠️ Security Alert: TxHash cannot be empty!');
                return;
            }

            // 1. Validate Payment ID format & length
            if (!paymentId || paymentId.length < 8) {
                alert('⚠️ Security System: Invalid or empty Payment ID! Enter an official Speed Wallet Payment ID.');
                return;
            }

            // 2. Reject Payment IDs outside Speed Wallet network
            if (!paymentId.toUpperCase().startsWith('SPD-') && !paymentId.toUpperCase().includes('SPEED')) {
                alert('⚠️ Security System: Automatic Rejection! Payment ID detected outside Speed Wallet network or counterfeit.');
                return;
            }

            // 3. Reject Reused Payment IDs
            if (SecurityVault.isPaymentUsed(paymentId)) {
                alert('⚠️ Security System: Automatic Rejection! This Payment ID has already been used (Replay Detected).');
                return;
            }

            // Register Payment ID and generate cryptographically bound Confirmation Code
            SecurityVault.registerPayment(paymentId);
            const secureCode = await SecurityVault.issueCodeForTx(currentTxHash);

            // Auto-fill and lock confirmation code field
            const codeInput = document.getElementById('confirmCode');
            codeInput.value = secureCode;
            codeInput.readOnly = true;
            codeInput.classList.add('verified-lock');
            
            tutupModalPembayaran();
            alert('✅ Payment of 50,000 satoshi verified via Speed Wallet!\nCryptographic confirmation code has been auto-filled and bound to this TxHash.');
        }

        async function prosesTransaksi(event) {
            event.preventDefault();
            const currentTxHash = document.getElementById('txHash').value.trim();
            const inputCode = document.getElementById('confirmCode').value.trim();
            const wallet = document.querySelector('input[name="wallet"]:checked').value;
            const fee = document.querySelector('input[name="fee"]:checked').value;

            // Validate Confirmation Code against Cryptographic Security Vault
            const check = await SecurityVault.validateAndConsumeCode(inputCode, currentTxHash);

            if (!check.valid) {
                let errorMsg = '⛔ SECURITY VIOLATION: Transaction Blocked!\n\n';
                switch (check.reason) {
                    case 'REPLAY_ATTACK':
                        errorMsg += 'Reason: Confirmation code has ALREADY BEEN USED (Replay Attack Blocked).';
                        break;
                    case 'WRONG_TRANSACTION':
                        errorMsg += 'Reason: Confirmation code belongs to ANOTHER TRANSACTION (TxHash Mismatch).';
                        break;
                    case 'TAMPERED_SIGNATURE':
                        errorMsg += 'Reason: Cryptographic signature tampering / hacking attempt detected.';
                        break;
                    case 'FAKE_OR_UNISSUED':
                    default:
                        errorMsg += 'Reason: Counterfeit, fabricated, or unverified confirmation code rejected.';
                        break;
                }
                alert(errorMsg);
                
                // Reset compromised input
                const codeField = document.getElementById('confirmCode');
                codeField.value = '';
                codeField.readOnly = false;
                codeField.classList.remove('verified-lock');
                return;
            }

            alert(`✅ SUCCESS! Transaction Verified & Broadcasted\n\nDestination: ${wallet}\nGas Fee: ${fee}\nTxHash: ${currentTxHash}\nStatus: Confirmation Code Validated & Consumed.`);

            // Reset form for next transaction
            document.getElementById('txHash').value = '';
            const codeField = document.getElementById('confirmCode');
            codeField.value = '';
            codeField.readOnly = false;
            codeField.classList.remove('verified-lock');
        }
    </script>
